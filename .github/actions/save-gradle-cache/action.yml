name: Save Gradle cache
description: Prunes transient Gradle files and saves the dependency cache on a miss.

inputs:
  key:
    description: Primary cache key from restore-gradle-cache
    required: true
  cache-hit:
    description: cache-hit output from restore-gradle-cache
    required: true

runs:
  using: composite
  steps:
    - name: Prune transient Gradle cache files
      if: inputs.cache-hit != 'true'
      shell: bash
      run: |
        # Drop downloaded wrapper zips (the unpacked dist and .ok marker stay)
        # and stale Gradle versions so wrapper/dists holds only the active one.
        active=$(sed -nE 's|^distributionUrl=.*/([^/]+)\.zip$|\1|p' gradle/wrapper/gradle-wrapper.properties | tr -d '\r')
        if [ -n "$active" ] && [ -d "$HOME/.gradle/wrapper/dists" ]; then
          for dir in "$HOME/.gradle/wrapper/dists"/*; do
            [ -e "$dir" ] || continue
            [ "$(basename "$dir")" = "$active" ] || rm -rf "$dir"
          done
        fi
        find "$HOME/.gradle/wrapper/dists" -type f \( -name '*.zip' -o -name '*.lck' \) -delete 2>/dev/null || true
        find "$HOME/.gradle/caches/modules-2" -type f \( -name '*.lock' -o -name 'gc.properties' \) -delete 2>/dev/null || true

    - name: Save Gradle cache
      if: inputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/wrapper/dists
          ~/.gradle/caches/modules-2/files-2.1
          ~/.gradle/caches/modules-2/metadata-*
        key: ${{ inputs.key }}
