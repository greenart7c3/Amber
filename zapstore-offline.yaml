  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/04-settings.png
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/05-security.png
  - ./fastlane/metadata/android/en-US/images/phoneScreenshots/06-applications-dark.png
