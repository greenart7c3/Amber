name: Test/Build Android

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      # Sole Linux cache writer (on master); PRs are read-only by default.
      # Disable setup-gradle's cache-cleanup (which strips plugin markers from
      # modules-2/files-2.1 on alternate runs); Gradle's own init script bounds
      # build-cache-1 and stale transforms on master instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-cleanup: never

      - name: Create keystore.properties
        run: touch keystore.properties

      - name: Linter (gradle)
        run: ./gradlew ktlintCheck detektAll --no-daemon

      - name: Test (gradle)
        run: ./gradlew test --no-daemon

      - name: Coverage (gradle)
        run: ./gradlew koverXmlReport koverHtmlReport :common:koverVerify --no-daemon

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Coverage report
          path: build/reports/kover

      # Serialize debug APK packaging: parallel ApkFlinger + apksig tasks across
      # 4 flavors x 5 ABI splits can deadlock ForkJoinPool.commonPool() on 4-core runners.
      - name: Build APK (gradle)
        env:
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
            ./gradlew assembleDebug --no-daemon --max-workers=1 --init-script .github/gradle/ci-cache-retention.init.gradle
          else
            ./gradlew assembleDebug --no-daemon --max-workers=1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Debug APK
          path: app/build/outputs/apk/free/debug/app-free-universal-debug.apk

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Build Reports
          path: app/build/reports


