repository: https://github.com/greenart7c3/Amber
release_source: https://github.com/greenart7c3/Amber
match: '^amber-offlinezapstore-arm64-v8a-.*\.apk$'

name: Amber Offline
summary: Nostr event signer for Android, without network access
description: |
  Amber is a nostr event signer for Android. It allows users to keep their nsec segregated in a single, dedicated app. "Private keys should be exposed to as few systems as possible as each system adds to the attack surface."
license: MIT

