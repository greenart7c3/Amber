name: Test/Build Android

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Restore Gradle cache
        id: gradle-cache
        uses: ./.github/actions/restore-gradle-cache

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: external

      - name: Create keystore.properties
        run: touch keystore.properties

      - name: Linter (gradle)
        run: ./gradlew ktlintCheck detektAll --no-daemon

      - name: Test (gradle)
        run: ./gradlew test --no-daemon

      - name: Coverage (gradle)
        run: ./gradlew koverXmlReport koverHtmlReport :common:koverVerify --no-daemon

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Coverage report
          path: build/reports/kover

      - name: Build APK (gradle)
        run: ./gradlew assembleDebug --no-daemon

      # Sole Linux cache writer: only saves on master after every build step succeeds.
      - name: Save Gradle cache
        if: success() && github.ref == 'refs/heads/master' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-gradle-cache
        with:
          key: ${{ steps.gradle-cache.outputs.cache-key }}
          cache-hit: ${{ steps.gradle-cache.outputs.cache-hit }}

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Debug APK
          path: app/build/outputs/apk/free/debug/app-free-universal-debug.apk

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Build Reports
          path: app/build/reports


