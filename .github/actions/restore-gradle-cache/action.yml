name: Restore Gradle cache
description: Restores Gradle wrapper distributions and downloaded dependency artifacts (read-only).

outputs:
  cache-hit:
    description: "'true' when an exact cache key match was restored"
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-key:
    description: "Primary cache key computed for this platform and build configuration"
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        echo "key=gradle-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/verification-metadata.xml', '**/*.gradle.kts') }}" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/wrapper/dists
          ~/.gradle/caches/modules-2/files-2.1
          ~/.gradle/caches/modules-2/metadata-*
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          gradle-deps-v1-${{ runner.os }}-${{ runner.arch }}-
