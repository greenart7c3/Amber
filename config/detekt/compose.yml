# Jetpack Compose rules (io.nlopez.compose.rules:detekt, versions.toml). They are
# off unless listed here, so this is the curated set: architecture (ViewModel
# forwarding/injection), modifier and parameter conventions, and effects that
# silently break recomposition. Opt-in rules we leave off: Material2,
# UnstableCollections, PreviewNaming.
Compose:
  active: true
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
    # The app dependencies (ui/AppDependencies.kt), provided once per activity
    # root instead of passed through every screen; the theme's dark and AMOLED
    # flags (ui/theme/Theme.kt), set by NostrSignerTheme like MaterialTheme's own
    # locals; and the desktop window's size and width bucket (WindowGeometry.kt),
    # provided once by App.
    allowedCompositionLocals: LocalSettingsStore,LocalAccountRepository,LocalRelayClient,LocalAppScope,LocalBunkerResponder,LocalBunkerRelay,LocalNotificationSubscription,LocalProfileSubscription,LocalPendingReports,LocalZapstoreUpdater,LocalDarkTheme,LocalAmoledTheme,LocalWindowContentSize,LocalLayoutWidth
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentSlotReused:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberMissing:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
