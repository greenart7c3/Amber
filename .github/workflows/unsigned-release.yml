name: Build All APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Build AAB and APKs
        run: |
          ./gradlew bundleFreeRelease bundleOfflineRelease assembleFreeRelease assembleOfflineRelease assembleOfflineZapstoreRelease --stacktrace

      # The Zapstore flavor exists for the separate "Amber Offline" listing, which
      # publishes the arm64-v8a APK only, so drop the other ABIs it also builds.
      - name: Keep only the arm64-v8a Zapstore offline APK
        run: |
          find app/build/outputs/apk/offlinezapstore -type f -name '*.apk' ! -name '*-arm64-v8a-*' -delete

      - name: Upload all APKs as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: All-APKs-${{ github.ref_name }}
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 14
